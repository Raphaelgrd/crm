<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Netforce Recorder — Paramètres</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #0f0f0f;
      color: #f0f0f0;
      padding: 32px;
      max-width: 480px;
    }
    h1 { font-size: 18px; margin-bottom: 6px; }
    p { color: #888; margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-size: 12px; font-weight: 600; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #f0f0f0;
      font-size: 14px;
      margin-bottom: 20px;
      outline: none;
    }
    input:focus { border-color: #555; }
    button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #fff;
      color: #000;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { opacity: .9; }
    .saved { color: #4ade80; font-size: 13px; margin-left: 12px; opacity: 0; transition: opacity .3s; }
    .saved.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>Netforce Recorder</h1>
  <p>Configure l'URL de ton CRM Netforce. L'extension enverra les transcriptions à cette adresse.</p>

  <label for="crmUrl">URL du CRM</label>
  <input id="crmUrl" type="url" placeholder="https://ton-crm.vercel.app" />

  <div style="display:flex;align-items:center">
    <button id="save">Sauvegarder</button>
    <span class="saved" id="savedMsg">✓ Sauvegardé</span>
  </div>
  <script src="options.js"></script>
</body>
</html>
